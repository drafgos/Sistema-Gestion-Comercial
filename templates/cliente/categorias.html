<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categorías</title>
</head>
<body>
    <h1>Categorías disponibles</h1>
    <ul>
        {% for categoria in categorias %}
            <li>
                <a href="/cliente/categoria/{{ categoria.id }}">
                    <strong>{{ categoria.nombre }}</strong>
                </a>
                - {{ categoria.descripcion }}
            </li>
        {% endfor %}
    </ul>
</body>
</html>
